<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!--app-head-->

    <!-- هر چهار وزن بالای تاشدگی استفاده می‌شوند (برند=Bold، نشان=SemiBold،
         متن اصلی=Regular)، پس preload می‌شوند تا کشفشان منتظر پارس‌شدن CSS
         نماند. font-display:swap در index.css همچنان فال‌بک نمایش می‌دهد اگر
         این‌ها دیر برسند؛ preload فقط فاصله‌ی جابه‌جایی فونت را کوتاه می‌کند. -->
    <link rel="preload" href="/fonts/Vazirmatn-UI-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-UI-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-UI-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-UI-Bold.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Google tag (gtag.js) — فقط سایت معرفی؛ پنل داخلی نرم‌افزار هیچ ردیاب
         شخص‌ثالثی ندارد. جزئیات در /privacy.
         bootstrap در فایل جدا (gtag-init.js) است، نه inline: یک اسکریپت inline
         script-src را مجبور می‌کرد 'unsafe-inline' بگیرد، که یعنی هر تزریق
         اسکریپتی (نه فقط این یکی) هم از همان راه رد می‌شد. فایل جدا با
         same-origin مجاز است بدون شل کردن سیاست. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E3JYRWWFCK"></script>
    <script src="/gtag-init.js"></script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
