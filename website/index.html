<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="کوبیتا — نرم‌افزار حسابداری ابری و آفلاین برای کسب‌وکارهای ایرانی. فاکتور فروش/خرید، انبارداری، حسابداری دوطرفه، چک و بانک و حقوق و دستمزد."
    />
    <link rel="canonical" href="https://cubita.ir/" />
    <meta name="theme-color" content="#ffffff" />
    <title>کوبیتا | نرم‌افزار حسابداری هوشمند</title>

    <!-- هر چهار وزن بالای تاشدگی استفاده می‌شوند (برند=Bold، نشان=SemiBold،
         متن اصلی=Regular)، پس preload می‌شوند تا کشفشان منتظر پارس‌شدن CSS
         نماند. font-display:swap در index.css همچنان فال‌بک نمایش می‌دهد اگر
         این‌ها دیر برسند؛ preload فقط فاصله‌ی جابه‌جایی فونت را کوتاه می‌کند. -->
    <link rel="preload" href="/fonts/Vazirmatn-UI-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-UI-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-UI-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-UI-Bold.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="کوبیتا" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:url" content="https://cubita.ir/" />
    <meta property="og:title" content="کوبیتا | نرم‌افزار حسابداری هوشمند" />
    <meta
      property="og:description"
      content="نرم‌افزار حسابداری ابری و آفلاین برای کسب‌وکارهای ایرانی. فاکتور، انبارداری، حسابداری دوطرفه، چک و بانک و حقوق و دستمزد در یک سیستم یکپارچه."
    />
    <meta property="og:image" content="https://cubita.ir/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="کوبیتا | نرم‌افزار حسابداری هوشمند" />
    <meta
      name="twitter:description"
      content="نرم‌افزار حسابداری ابری و آفلاین برای کسب‌وکارهای ایرانی."
    />
    <meta name="twitter:image" content="https://cubita.ir/og-image.jpg" />

    <!-- داده‌ی ساخت‌یافته. عمداً بدون offers/price: پلن‌ها از API خوانده می‌شوند و
         قیمت ثابت اینجا دیر یا زود با قیمت واقعی سایت واگرا می‌شد. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "کوبیتا",
            "url": "https://cubita.ir/",
            "logo": "https://cubita.ir/favicon.svg",
            "email": "ipnetcity@gmail.com"
          },
          {
            "@type": "SoftwareApplication",
            "name": "کوبیتا",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Windows, Web",
            "url": "https://cubita.ir/",
            "description": "نرم‌افزار حسابداری ابری و آفلاین برای کسب‌وکارهای ایرانی — فاکتور فروش/خرید، انبارداری، حسابداری دوطرفه، چک و بانک، حقوق و دستمزد.",
            "inLanguage": "fa-IR"
          }
        ]
      }
    </script>

    <!-- Google tag (gtag.js) — فقط سایت معرفی؛ پنل داخلی نرم‌افزار هیچ ردیاب
         شخص‌ثالثی ندارد. جزئیات در /privacy.
         bootstrap در فایل جدا (gtag-init.js) است، نه inline: یک اسکریپت inline
         script-src را مجبور می‌کرد 'unsafe-inline' بگیرد، که یعنی هر تزریق
         اسکریپتی (نه فقط این یکی) هم از همان راه رد می‌شد. فایل جدا با
         same-origin مجاز است بدون شل کردن سیاست. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E3JYRWWFCK"></script>
    <script src="/gtag-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
