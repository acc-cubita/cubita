services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hesabdari
      POSTGRES_PASSWORD: hesabdari
      POSTGRES_DB: hesabdari
    ports:
      - "5432:5432"
    volumes:
      - hesabdari_pgdata:/var/lib/postgresql/data

volumes:
  hesabdari_pgdata:
