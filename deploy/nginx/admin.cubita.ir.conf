# ⚠️ این فایل **مرجع** است، نه پیکربندیِ زنده.
#
# هیچ‌کدام از vhostهای کوبیتا در مخزن نیستند؛ فایلِ واقعی روی سرور است
# (`/etc/nginx/sites-available/cubita-admin`). این نسخه وجود دارد تا دست‌کم یک
# مرجع برای diff داشته باشیم — پیش از هر تغییری روی سرور، آن را با این مقایسه
# کنید و هر واگرایی را اینجا هم ثبت کنید.
#
# نسخه‌ی زنده در ۱۴۰۵/۰۶/۳۰ نصب شد و این فایل **عیناً** همان است.
#
# ⛔ vhostِ `acc.cubita.ir` را لمس نکنید — این فایل فقط به زیردامنه‌ی ستاد
#    مربوط است.

server {
    # **بدونِ `http2`.** nginx این سرور ۱.۱۸ است و دستورِ `http2 on;` از ۱.۲۵.۱
    # به بعد وجود دارد — نسخه‌ی اولِ همین فایل آن را داشت و روی سرور خطای نحو
    # می‌داد. شکلِ قدیمی `listen 443 ssl http2;` است، ولی vhostهای دیگرِ همین
    # سرور هم http2 ندارند و هم‌شکل ماندن از یک بهینه‌سازیِ تنها مهم‌تر است.
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name admin.cubita.ir;

    root /opt/cubita-admin/web;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/admin.cubita.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.cubita.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ══════════════════════════════════════════════════════════════════════
    # ⚠️⚠️ عددِ این پورت مهم‌ترین خطِ این فایل است.
    #
    # ۸۰۰۱ = بک‌اندِ production (همان که acc.cubita.ir استفاده می‌کند).
    # ۸۰۰۲ = بک‌اندِ خفته‌ی دمو، با مهاجرتِ قدیمی و بدونِ جدول‌های تازه.
    #
    # یک‌بار همین اشتباه روی demo.cubita.ir افتاد و هفته‌ها زنده ماند: اپ سالم
    # به‌نظر می‌رسید، حساب‌ها ساخته می‌شدند، و هیچ‌کدام در دیتابیسِ واقعی نبودند.
    # `/api/health` هم «ok» می‌داد چون آن بک‌اند هم سالم بود.
    #
    # کاوشِ درست: `/api/admin/diagnostics` نامِ دیتابیس و نسخه‌ی مهاجرت را
    # می‌گوید؛ و ورودِ موفقِ کارمندِ ستاد اثباتِ قطعی است، چون جدولِ
    # `platform_admins` فقط در دیتابیسِ production پر است.
    # ══════════════════════════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # سقفِ واقعیِ حدسِ رمز. محدودکننده‌ی داخلِ برنامه درون‌فرایندی است و با چند
    # worker ضرب می‌شود؛ این یکی نمی‌شود.
    #
    # زونِ `adminlogin` در `/etc/nginx/conf.d/cubita-admin-ratelimit.conf` تعریف
    # می‌شود — **نه** داخلِ این فایل، چون `limit_req_zone` فقط در بلاکِ `http{}`
    # مجاز است. گذاشتنش در `conf.d` یعنی `nginx.conf` هیچ‌وقت دست نمی‌خورد:
    #     limit_req_zone $binary_remote_addr zone=adminlogin:1m rate=10r/m;
    location = /api/admin/auth/login {
        limit_req zone=adminlogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # `index.html` هرگز کش نشود.
    #
    # بدونِ این، مرورگری که نسخه‌ی قبل را دارد تا انقضای کش همان را نشان می‌دهد
    # و به فایل‌های `assets/`ای اشاره می‌کند که دیگر وجود ندارند — صفحه‌ی سفید،
    # بدونِ هیچ خطای قابلِ فهم.
    #
    # ⚠️ **هدرهای امنیتی عمداً در هر سه بلاک تکرار شده‌اند.** در nginx اگر یک
    # سطح `add_header`ِ خودش را داشته باشد، هیچ‌کدام از هدرهای سطحِ بالاتر را به
    # ارث **نمی‌برد**. نسخه‌ی اولِ این فایل آن‌ها را فقط در سطحِ `server` داشت،
    # که یعنی دقیقاً صفحه‌ی اصلیِ پنلِ مدیریت بی‌گاردِ clickjacking می‌ماند —
    # خرابی‌ای که هیچ خطایی نمی‌دهد و فقط در هدرهای پاسخ دیده می‌شود.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # `assets/*` هش در نامشان دارند و می‌توانند برای همیشه کش شوند.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # عمداً **بدونِ** بلاکِ /updates/ — فیدِ به‌روزرسانیِ دسکتاپ فقط مالِ
    # acc.cubita.ir است و اینجا کاری ندارد.
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.cubita.ir;
    # تمدیدِ گواهی از راهِ DNS-01 است، پس پورت ۸۰ دیگر برای ACME لازم نیست.
    return 301 https://$host$request_uri;
}

# ── راه‌اندازیِ اولیه روی سرور ──────────────────────────────────────────────
#
# ⚠️ **چالشِ HTTP-01 روی این سرور کار نمی‌کند.** پورت ۸۰ از خارجِ ایران
# timeout می‌دهد (سرور در تهران است، Hostiran/AS59441؛ پورت ۴۴۳ باز است ولی
# ۸۰ نه). هم Let's Encrypt و هم یک fetcherِ ثالثِ مستقل این را تأیید کردند.
# نه DNS مقصر بود، نه ufw، نه fail2ban — همه سالم بودند.
#
# پس **DNS-01 از راهِ Cloudflare** تنها راه است. Cloudflare از قبل
# authoritativeِ `cubita.ir` است. این برای *همه‌ی* گواهی‌های این سرور صادق است،
# نه فقط این یکی؛ در ۱۴۰۵/۰۶/۳۰ هر چهار گواهیِ کوبیتا به DNS-01 کوچ کردند.
#
# ۱. mkdir -p /opt/cubita-admin/web && echo ok > /opt/cubita-admin/web/index.html
# ۲. apt-get install -y python3-certbot-dns-cloudflare
# ۳. توکنِ Cloudflare با مجوزِ Zone:DNS:Edit روی زونِ cubita.ir، **بدونِ TTL**
#    (توکنِ منقضی‌شونده تمدیدِ خودکار را بی‌صدا می‌شکند) و **بدونِ فیلترِ IP**
#    (IPِ خروجیِ سرور با IPِ ورودی‌اش فرق دارد و از یک تونل می‌آید):
#      printf 'dns_cloudflare_api_token = %s\n' 'TOKEN' > /etc/letsencrypt/cloudflare.ini
#      chmod 600 /etc/letsencrypt/cloudflare.ini
# ۴. certbot certonly --dns-cloudflare \
#        --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#        --dns-cloudflare-propagation-seconds 30 -d admin.cubita.ir
# ۵. زونِ نرخ در conf.d، این فایل در sites-available، لینک در sites-enabled،
#    بعد `nginx -t` و `systemctl reload nginx`
# ۶. کاوش کن **پیش از** اولین باندلِ واقعی:
#      curl -I https://admin.cubita.ir/
#      curl -s https://admin.cubita.ir/api/health          → {"status":"ok"}
#      curl -o /dev/null -w '%{http_code}\n' \
#           https://admin.cubita.ir/api/admin/auth/me      → 401 (نه 404)
#
# ۴۰۴ در گامِ آخر دو معنیِ کاملاً متفاوت دارد و باید از هم جدا شوند:
#   • بدنه‌ی HTML  → `location /api/` کار نمی‌کند و nginx fallbackِ SPA را
#                    برمی‌گرداند — همان خرابیِ خاموشِ دمو.
#   • بدنه‌ی {"detail":"Not Found"} با نوعِ application/json → پراکسی **سالم**
#     است و درخواست به FastAPI رسیده؛ فقط بک‌اندِ مستقر هنوز درختِ /api/admin
#     را ندارد. بعد از استقرارِ بک‌اند ۴۰۱ می‌شود.
#
# ── deploy hook ────────────────────────────────────────────────────────────
# با authenticatorِ `nginx` خودِ certbot بعد از تمدید ری‌لود می‌کرد. با
# `dns-cloudflare` دیگر installerی در کار نیست، پس بدونِ این هوک گواهیِ تازه
# روی دیسک می‌نشیند و nginx تا اولین ری‌استارت همان قدیمی را از حافظه سرو
# می‌کند — تمدید «موفق» گزارش می‌شود و سایت باز هم منقضی می‌شود:
#   /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh  (chmod 755)
