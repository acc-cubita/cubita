# ⚠️ این فایل **مرجع** است، نه پیکربندیِ زنده.
#
# هیچ‌کدام از vhostهای کوبیتا در مخزن نیستند؛ فایلِ واقعی روی سرور است
# (`/etc/nginx/sites-available/admin.cubita.ir`). این نسخه وجود دارد تا دست‌کم
# یک مرجع برای diff داشته باشیم — پیش از هر تغییری روی سرور، آن را با این
# مقایسه کنید و هر واگرایی را اینجا هم ثبت کنید.
#
# ⛔ vhostهای `acc.cubita.ir` و `ipnetcity.ir` را لمس نکنید. دومی سایتِ دوربینِ
#    یک مشتریِ کاملاً جداست که روی همین سرور میزبانی می‌شود.

server {
    listen 443 ssl;
    http2 on;
    server_name admin.cubita.ir;

    root /opt/cubita-admin/web;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/admin.cubita.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.cubita.ir/privkey.pem;

    # ══════════════════════════════════════════════════════════════════════
    # ⚠️⚠️ عددِ این پورت مهم‌ترین خطِ این فایل است.
    #
    # ۸۰۰۱ = بک‌اندِ production (همان که acc.cubita.ir استفاده می‌کند).
    # ۸۰۰۲ = بک‌اندِ خفته‌ی دمو، با مهاجرتِ ۰۰۵۰ و بدونِ جدول‌های تازه.
    #
    # یک‌بار همین اشتباه روی demo.cubita.ir افتاد و هفته‌ها زنده ماند: اپ سالم
    # به‌نظر می‌رسید، حساب‌ها ساخته می‌شدند، و هیچ‌کدام در دیتابیسِ واقعی نبودند.
    # `/api/health` هم «ok» می‌داد چون آن بک‌اند هم سالم بود.
    #
    # کاوشِ درست: `/api/admin/diagnostics` نامِ دیتابیس و نسخه‌ی مهاجرت را
    # می‌گوید؛ و ورودِ موفقِ کارمندِ ستاد اثباتِ قطعی است، چون جدولِ
    # `platform_admins` فقط در دیتابیسِ production پر است.
    # ══════════════════════════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # سقفِ واقعیِ حدسِ رمز. محدودکننده‌ی داخلِ برنامه درون‌فرایندی است و با چند
    # worker ضرب می‌شود؛ این یکی نمی‌شود. (زونِ `adminlogin` در بلاکِ http تعریف
    # می‌شود — پایینِ همین فایل.)
    location = /api/admin/auth/login {
        limit_req zone=adminlogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # `index.html` هرگز کش نشود.
    #
    # بدونِ این، مرورگری که نسخه‌ی قبل را دارد تا انقضای کش همان را نشان می‌دهد
    # و به فایل‌های `assets/` ای اشاره می‌کند که دیگر وجود ندارند — صفحه‌ی سفید،
    # بدونِ هیچ خطای قابلِ فهم. خودِ `assets/*` هش در نامشان دارند و می‌توانند
    # برای همیشه کش شوند.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # عمداً **بدونِ** بلاکِ /updates/ — فیدِ به‌روزرسانیِ دسکتاپ فقط مالِ
    # acc.cubita.ir است و اینجا کاری ندارد.
}

server {
    listen 80;
    server_name admin.cubita.ir;
    return 301 https://$host$request_uri;
}

# ── در بلاکِ http{} (مثلاً /etc/nginx/nginx.conf) ──────────────────────────
# limit_req_zone $binary_remote_addr zone=adminlogin:1m rate=10r/m;
#
# ── ترتیبِ راه‌اندازیِ اولیه روی سرور ────────────────────────────────────────
# ۱. mkdir -p /opt/cubita-admin/web && echo ok > /opt/cubita-admin/web/index.html
# ۲. یک vhostِ موقتِ پورت ۸۰ برای چالشِ HTTP-01
# ۳. certbot --nginx -d admin.cubita.ir
# ۴. این فایل را نصب کن، nginx -t، systemctl reload nginx
# ۵. کاوش کن **پیش از** اولین باندلِ واقعی:
#      curl -I https://admin.cubita.ir/
#      curl -s https://admin.cubita.ir/api/health          → {"status":"ok"}
#      curl -o /dev/null -w '%{http_code}\n' \
#           https://admin.cubita.ir/api/admin/auth/me      → 401 (نه 404)
#
# ۴۰۴ در گامِ آخر یعنی `location /api/` کار نمی‌کند و nginx دارد fallbackِ SPA
# را برمی‌گرداند — همان خرابیِ خاموشی که بالا توضیح داده شد.
