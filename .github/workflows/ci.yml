name: CI

# تست‌ها تا امروز فقط وقتی اجرا می‌شدند که کسی دستی اجرایشان کند. ۳۴۴ تست که
# خودکار اجرا نشوند، تستی هستند که به‌مرور می‌پوسند و کسی نمی‌فهمد کِی از کار افتادند.

on:
  # عمداً فقط `master` روی push. تا امروز `["**"]` بود و در کنارِ `pull_request`
  # یعنی هر پوش روی شاخه‌ی PR‌دار **دو اجرا** می‌ساخت — دو برابرِ فشار روی صف،
  # بدونِ یک ذره اطلاعاتِ بیشتر.
  push:
    branches: [master]
  pull_request:

# اجرای قدیمیِ همان شاخه‌ی PR با پوشِ تازه لغو می‌شود. بدونِ این، پنج پوشِ پشتِ‌هم یعنی
# پنج اجرای موازی که همه‌شان جز آخری بی‌فایده‌اند و اسلاتِ همزمانی را می‌گیرند.
#
# **ولی روی `master` هر کامیت گروهِ خودش را دارد و هیچ‌وقت لغو نمی‌شود.** هر کامیتِ
# `master` یک مرج است، نه پوشِ جایگزین. چهار مرجِ پشتِ‌هم (#۱۷۴–#۱۷۷) سه‌تایشان را
# با «✗ ۲/۴» گذاشت. این ✗ لغوشده بود، نه شکست‌خورده، ولی از بیرون فرقی نداشت و
# وقت گرفت. قرمزِ دروغین عادت می‌دهد که قرمزِ واقعی هم نادیده گرفته شود.
# `cancel-in-progress: false` کافی نبود: گروه فقط یک اجرای در انتظار نگه می‌دارد و
# سومین مرج همان را لغو می‌کند. پس گروه روی `master` به‌ازای sha است.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # بدونِ سقفِ زمان، جابِ هنگ‌کرده **تا شش ساعت** (پیش‌فرضِ GitHub) اسلات را
    # نگه می‌دارد و کلِ صف پشتش می‌ماند — دقیقاً همان چیزی که اتفاق افتاد.
    timeout-minutes: 25

    services:
      postgres:
        # نسخه عمداً با production یکی است. تست روی نسخه‌ی دیگر، سبزِ گمراه‌کننده
        # می‌دهد — همان فاصله‌ای که مجبور شدم دستی روی خودِ سرور بسنجم.
        image: postgres:14
        env:
          POSTGRES_USER: cubita
          POSTGRES_PASSWORD: cubita
          POSTGRES_DB: cubita_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # **کاربرِ اپ عمداً superuser نیست.** `cubita` کاربرِ bootstrapِ ایمیجِ پستگرس
      # و در نتیجه superuser است — و RLS روی superuser **هرگز** اعمال نمی‌شود، حتی
      # با FORCE. با آن کاربر، `test_cross_tenant_leak` واقعاً نشت می‌دید و شکست
      # می‌خورد؛ یعنی CI از روزِ اول نمی‌توانست سبز شود.
      #
      # `cubita_app` نقشِ عادی است و مالکِ جدول‌هایی می‌شود که خودش می‌سازد، پس
      # FORCE رویش اثر دارد — دقیقاً همان چیزی که روی production اتفاق می‌افتد.
      DATABASE_URL: postgresql+psycopg://cubita_app:cubita_app@localhost:5432/cubita_ci
      ADMIN_URL: postgresql://cubita:cubita@localhost:5432/cubita_ci
      ENV: development
      ZARINPAL_SANDBOX: "true"
      JWT_SECRET: ci-only-secret-not-used-outside-github-actions-0123
      PLATFORM_ADMIN_EMAILS: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # همان نسخه‌ی VPS
          cache: pip

      - name: نصب وابستگی‌ها
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: نقشِ اپ و سقفِ زمانِ دیتابیس
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE cubita_app LOGIN PASSWORD 'cubita_app';
          GRANT ALL ON DATABASE cubita_ci TO cubita_app;
          -- کوئری یا قفلِ بی‌پایان باید **بلند بمیرد**، نه اینکه جاب را ساکت تا
          -- سقفِ زمان ببرد. اجرای قبل ۲۳ دقیقه روی یک تست ایستاد و نه
          -- `--timeout-method=thread` توانست بشکندش نه `signal` — چون انتظارِ
          -- قفل داخلِ libpq است. سقفِ سمتِ سرور این را قطعی حل می‌کند.
          ALTER DATABASE cubita_ci SET statement_timeout = '60s';
          ALTER DATABASE cubita_ci SET lock_timeout = '30s';
          SQL

      - name: اجرای تست‌ها
        working-directory: backend
        # `-p no:cacheprovider` چون کشِ pytest روی رانرِ یک‌بارمصرف بی‌فایده است.
        #
        # `--timeout` روشِ **signal** می‌خواهد نه thread: تستی که در انتظارِ قفلِ
        # دیتابیس بلاک شده داخلِ یک فراخوانیِ C است و thread نمی‌تواند قطعش کند —
        # همان چیزی که در اجرای قبل ۲۳ دقیقه ساکت ماند. signal با SIGALRM آن را
        # هم می‌شکند. (پیش‌فرضِ pytest-timeout روی یونیکس همین است.)
        run: pytest -q -p no:cacheprovider --timeout=120

      - name: مهاجرت‌ها از صفر تا head اجرا می‌شوند
        # این جدا از تست‌هاست: مجموعه‌ی تست با create_all جدول می‌سازد، پس
        # مهاجرتی که بشکند در تست‌ها دیده نمی‌شود ولی روی production می‌شکند.
        #
        # `alembic check` عمداً اینجا نیست. امروز ۵۸ مورد انحراف گزارش می‌کند که
        # تقریباً همه‌شان آرایشی‌اند (NOT NULL روی ستون‌های created_at/updated_at،
        # و قید یکتا در برابر ایندکس یکتا). چکی که از روز اول قرمز باشد فقط به
        # همه یاد می‌دهد CI را نادیده بگیرند — که بدتر از نداشتنش است.
        #
        # انحرافِ *معنادار* را `tests/test_migration_drift.py` می‌گیرد: جدول
        # گم‌شده، ایندکس یکتای سراسری روی جدول مستأجرمحور، RLS اعمال‌نشده، و
        # مدلی که در app/models/__init__.py وارد نشده باشد.
        working-directory: backend
        #
        # پاک‌سازی با کاربرِ ادمین انجام می‌شود (اسکیمای `public` مالِ اوست) ولی
        # مالکیتش به `cubita_app` داده می‌شود تا مهاجرت‌ها و بعدش اپ، با همان
        # نقشِ غیرِsuperuser کار کنند — مثلِ production.
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 \
            -c "DROP SCHEMA IF EXISTS public CASCADE" \
            -c "CREATE SCHEMA public AUTHORIZATION cubita_app"
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ۲۰ نه: پشتیبانی‌اش فروردینِ ۱۴۰۵ تمام شد، و `vitest`ِ نصب‌شده خودش
          # `^22.12 || ^24 || >=26` می‌خواهد — روی ۲۰ فقط تصادفاً کار می‌کرد. همان
          # نسخه برای هر چهار جابِ Node (frontend، e2e، admin، mobile).
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: نصب
        working-directory: desktop
        run: npm ci
        env:
          # playwright فقط برای `verify-pages.mjs` است و آن اسکریپت بک‌اندِ زنده
          # و اعتبارنامه می‌خواهد، پس در CI اجرا نمی‌شود. بدونِ این متغیر،
          # postinstallِ playwright سه مرورگر (~۴۰۰ مگابایت) را در **هر** اجرا
          # دانلود می‌کند — هزینه‌ای که هیچ قدمی این‌جا مصرفش نمی‌کند.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: بررسی نوع‌ها
        working-directory: desktop
        run: npx tsc -b

      - name: lint
        working-directory: desktop
        run: npx oxlint src/

      - name: تست‌های واحد
        # تا امروز دسکتاپ هیچ تستی نداشت و ۷۹ هزار خط بدونِ اثبات می‌ماند.
        # اولین‌ها عمداً جاهایی‌اند که شکستنشان گران است: پروتکلِ کارتخوان (پیام
        # به دستگاهِ بانکی می‌رود)، قاعده‌ی تخفیف (مبلغِ فاکتور را عوض می‌کند)،
        # و سقفِ صفحه‌بندی (یک بار فهرستِ اسناد را بی‌صدا خالی کرد).
        working-directory: desktop
        run: npm test

      - name: ممیزِ ساختاریِ صفحه‌ها
        # ۱۲ قاعده — از جمله R11 (قاعده‌ی نظیر: هر منوی عملیاتی یک فهرست) و
        # R12 (کدِ مرده). محلی همیشه اجرا می‌شود؛ بدونِ این قدم فقط تا وقتی
        # کسی یادش بماند دستی بزند.
        working-directory: desktop
        run: node scripts/audit-pages.mjs

      - name: build
        working-directory: desktop
        run: npx vite build
        env:
          VITE_API_URL: https://acc.cubita.ir

  e2e:
    # ثبتِ سندِ حرفه‌ای از ورود تا ذخیره روی سرور، **فقط با کیبورد** (desktop/e2e).
    # بک‌اند و وبِ واقعی روی پایگاه‌داده‌ی دورریختنیِ همین رانر. تست‌های jsdom هر رفتار
    # را جدا می‌سنجند؛ این یکی می‌گوید کنارِ هم هم کار می‌کنند — همان‌طور که اولین
    # اجرایش نشان داد فوکوسِ خودکارِ گرید بعد از کلیک روی نوار نمی‌رسید.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:14 # همان نسخه‌ی تولید، مثلِ جابِ backend
        env:
          POSTGRES_USER: cubita
          POSTGRES_PASSWORD: cubita
          POSTGRES_DB: cubita_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # همان قراردادِ جابِ backend: اپ با نقشِ عادیِ `cubita_app` کار می‌کند، نه superuser.
      DATABASE_URL: postgresql+psycopg://cubita_app:cubita_app@localhost:5432/cubita_e2e
      ADMIN_URL: postgresql://cubita:cubita@localhost:5432/cubita_e2e
      ENV: development
      ZARINPAL_SANDBOX: "true"
      JWT_SECRET: ci-only-secret-not-used-outside-github-actions-0123
      PLATFORM_ADMIN_EMAILS: ""
      ALLOWED_ORIGINS: http://localhost:5173
      E2E_EMAIL: e2e.accountant@example.com
      E2E_PASSWORD: E2e@Journal2026

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: نصبِ بک‌اند
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: پایگاه‌داده‌ی دورریختنی، مهاجرت‌ها، کسب‌وکارِ آزمایشی
        working-directory: backend
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE cubita_app LOGIN PASSWORD 'cubita_app'" \
            -c "GRANT ALL ON DATABASE cubita_e2e TO cubita_app" \
            -c "DROP SCHEMA IF EXISTS public CASCADE" \
            -c "CREATE SCHEMA public AUTHORIZATION cubita_app"
          alembic upgrade head
          python ../desktop/e2e/provision.py

      - name: اجرای بک‌اند
        working-directory: backend
        run: nohup uvicorn app.main:app --port 8000 > ../uvicorn.log 2>&1 &

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: نصبِ وب و کرومیوم
        working-directory: desktop
        run: |
          npm ci
          npx playwright install --with-deps chromium
        env:
          # فقط کرومیوم، با قدمِ بالا — نه سه مرورگرِ postinstall.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: اجرای وب و انتظار برای هر دو
        working-directory: desktop
        run: |
          nohup env WEB_ONLY=1 npx vite --port 5173 --strictPort > ../vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/health > /dev/null && curl -sf http://localhost:5173/ > /dev/null && exit 0
            sleep 2
          done
          echo "بک‌اند یا وب بالا نیامد"; cat ../uvicorn.log ../vite.log; exit 1

      - name: E2E — سندِ حرفه‌ای فقط با کیبورد
        working-directory: desktop
        run: node e2e/accountant-journal.e2e.mjs
        env:
          E2E_OUT: e2e-artifacts

      - name: عکس و لاگ‌ها، اگر شکست خورد
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            desktop/e2e-artifacts
            uvicorn.log
            vite.log
          if-no-files-found: ignore

  admin:
    # اپِ ستاد (admin.cubita.ir) — پروژه‌ی مستقل، پس jobِ مستقل.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: نصب
        working-directory: admin
        run: npm ci

      - name: بررسی نوع‌ها
        working-directory: admin
        run: npx tsc -b

      - name: lint
        working-directory: admin
        run: npx oxlint src

      - name: تست‌های واحد
        working-directory: admin
        run: npm test

      - name: ممیزِ ساختاری
        # نُه قاعده‌ی مخصوصِ این اپ. `audit-pages.mjs`ِ دسکتاپ به کار نمی‌آید:
        # مسیرش سیم‌کشی‌شده است و چهار قاعده‌اش روی `NAV_GROUPS` کار می‌کنند که
        # اینجا وجود ندارد.
        working-directory: admin
        run: node scripts/audit-admin.mjs

      - name: واگراییِ فایل‌های مشترک
        # چهار فایل از `desktop/src` کپی شده‌اند. این قدم تنها چیزی است که
        # واگرایی را **پرصدا** می‌کند؛ بدونش یکی از دو نسخه بی‌صدا عقب می‌ماند.
        working-directory: admin
        run: node scripts/check-shared.mjs

      - name: build
        working-directory: admin
        run: npx vite build
        env:
          # همان آدرسی که `deploy-admin-web.sh` پیش از جابه‌جایی grepش می‌کند.
          VITE_API_URL: https://admin.cubita.ir

  mobile:
    runs-on: ubuntu-latest
    # همان دلیلِ دو jobِ بالا: jobِ هنگ‌کرده بدونِ سقف تا شش ساعت اسلات را
    # نگه می‌دارد و صف پشتش می‌ماند.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: نصب
        run: npm ci

      - name: بررسی نوع‌ها
        run: npx tsc --noEmit

      - name: تست‌ها
        # اپ روی کافه‌بازار زنده است؛ تا پیش از این هیچ چیزی جز اجرای دستی
        # نمی‌گفت چیزی شکسته یا نه.
        run: npx jest --ci

      - name: ممیزِ ساختاری
        # معادلِ audit-pages.mjs دسکتاپ. کدِ مرده را می‌گیرد — همان چیزی که
        # باعث شد isOwner/hasPermission ماه‌ها بی‌استفاده بمانند بی‌آنکه کسی بفهمد.
        run: node scripts/audit-mobile.mjs
