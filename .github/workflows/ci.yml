name: CI

# تست‌ها تا امروز فقط وقتی اجرا می‌شدند که کسی دستی اجرایشان کند. ۳۴۴ تست که
# خودکار اجرا نشوند، تستی هستند که به‌مرور می‌پوسند و کسی نمی‌فهمد کِی از کار افتادند.

on:
  # عمداً فقط `master` روی push. تا امروز `["**"]` بود و در کنارِ `pull_request`
  # یعنی هر پوش روی شاخه‌ی PR‌دار **دو اجرا** می‌ساخت — دو برابرِ فشار روی صف،
  # بدونِ یک ذره اطلاعاتِ بیشتر.
  push:
    branches: [master]
  pull_request:

# اجرای قدیمیِ همان شاخه با پوشِ تازه لغو می‌شود. بدونِ این، پنج پوشِ پشتِ‌هم یعنی
# پنج اجرای موازی که همه‌شان جز آخری بی‌فایده‌اند و اسلاتِ همزمانی را می‌گیرند.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # بدونِ سقفِ زمان، جابِ هنگ‌کرده **تا شش ساعت** (پیش‌فرضِ GitHub) اسلات را
    # نگه می‌دارد و کلِ صف پشتش می‌ماند — دقیقاً همان چیزی که اتفاق افتاد.
    timeout-minutes: 25

    services:
      postgres:
        # نسخه عمداً با production یکی است. تست روی نسخه‌ی دیگر، سبزِ گمراه‌کننده
        # می‌دهد — همان فاصله‌ای که مجبور شدم دستی روی خودِ سرور بسنجم.
        image: postgres:14
        env:
          POSTGRES_USER: cubita
          POSTGRES_PASSWORD: cubita
          POSTGRES_DB: cubita_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # **کاربرِ اپ عمداً superuser نیست.** `cubita` کاربرِ bootstrapِ ایمیجِ پستگرس
      # و در نتیجه superuser است — و RLS روی superuser **هرگز** اعمال نمی‌شود، حتی
      # با FORCE. با آن کاربر، `test_cross_tenant_leak` واقعاً نشت می‌دید و شکست
      # می‌خورد؛ یعنی CI از روزِ اول نمی‌توانست سبز شود.
      #
      # `cubita_app` نقشِ عادی است و مالکِ جدول‌هایی می‌شود که خودش می‌سازد، پس
      # FORCE رویش اثر دارد — دقیقاً همان چیزی که روی production اتفاق می‌افتد.
      DATABASE_URL: postgresql+psycopg://cubita_app:cubita_app@localhost:5432/cubita_ci
      ADMIN_URL: postgresql://cubita:cubita@localhost:5432/cubita_ci
      ENV: development
      ZARINPAL_SANDBOX: "true"
      JWT_SECRET: ci-only-secret-not-used-outside-github-actions-0123
      PLATFORM_ADMIN_EMAILS: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # همان نسخه‌ی VPS
          cache: pip

      - name: نصب وابستگی‌ها
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: نقشِ اپ و سقفِ زمانِ دیتابیس
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE cubita_app LOGIN PASSWORD 'cubita_app';
          GRANT ALL ON DATABASE cubita_ci TO cubita_app;
          -- کوئری یا قفلِ بی‌پایان باید **بلند بمیرد**، نه اینکه جاب را ساکت تا
          -- سقفِ زمان ببرد. اجرای قبل ۲۳ دقیقه روی یک تست ایستاد و نه
          -- `--timeout-method=thread` توانست بشکندش نه `signal` — چون انتظارِ
          -- قفل داخلِ libpq است. سقفِ سمتِ سرور این را قطعی حل می‌کند.
          ALTER DATABASE cubita_ci SET statement_timeout = '60s';
          ALTER DATABASE cubita_ci SET lock_timeout = '30s';
          SQL

      - name: اجرای تست‌ها
        working-directory: backend
        # `-p no:cacheprovider` چون کشِ pytest روی رانرِ یک‌بارمصرف بی‌فایده است.
        #
        # `--timeout` روشِ **signal** می‌خواهد نه thread: تستی که در انتظارِ قفلِ
        # دیتابیس بلاک شده داخلِ یک فراخوانیِ C است و thread نمی‌تواند قطعش کند —
        # همان چیزی که در اجرای قبل ۲۳ دقیقه ساکت ماند. signal با SIGALRM آن را
        # هم می‌شکند. (پیش‌فرضِ pytest-timeout روی یونیکس همین است.)
        run: pytest -q -p no:cacheprovider --timeout=120

      - name: مهاجرت‌ها از صفر تا head اجرا می‌شوند
        # این جدا از تست‌هاست: مجموعه‌ی تست با create_all جدول می‌سازد، پس
        # مهاجرتی که بشکند در تست‌ها دیده نمی‌شود ولی روی production می‌شکند.
        #
        # `alembic check` عمداً اینجا نیست. امروز ۵۸ مورد انحراف گزارش می‌کند که
        # تقریباً همه‌شان آرایشی‌اند (NOT NULL روی ستون‌های created_at/updated_at،
        # و قید یکتا در برابر ایندکس یکتا). چکی که از روز اول قرمز باشد فقط به
        # همه یاد می‌دهد CI را نادیده بگیرند — که بدتر از نداشتنش است.
        #
        # انحرافِ *معنادار* را `tests/test_migration_drift.py` می‌گیرد: جدول
        # گم‌شده، ایندکس یکتای سراسری روی جدول مستأجرمحور، RLS اعمال‌نشده، و
        # مدلی که در app/models/__init__.py وارد نشده باشد.
        working-directory: backend
        #
        # پاک‌سازی با کاربرِ ادمین انجام می‌شود (اسکیمای `public` مالِ اوست) ولی
        # مالکیتش به `cubita_app` داده می‌شود تا مهاجرت‌ها و بعدش اپ، با همان
        # نقشِ غیرِsuperuser کار کنند — مثلِ production.
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 \
            -c "DROP SCHEMA IF EXISTS public CASCADE" \
            -c "CREATE SCHEMA public AUTHORIZATION cubita_app"
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: نصب
        working-directory: desktop
        run: npm ci
        env:
          # playwright فقط برای `verify-pages.mjs` است و آن اسکریپت بک‌اندِ زنده
          # و اعتبارنامه می‌خواهد، پس در CI اجرا نمی‌شود. بدونِ این متغیر،
          # postinstallِ playwright سه مرورگر (~۴۰۰ مگابایت) را در **هر** اجرا
          # دانلود می‌کند — هزینه‌ای که هیچ قدمی این‌جا مصرفش نمی‌کند.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: بررسی نوع‌ها
        working-directory: desktop
        run: npx tsc -b

      - name: lint
        working-directory: desktop
        run: npx oxlint src/

      - name: ممیزِ ساختاریِ صفحه‌ها
        # ۱۲ قاعده — از جمله R11 (قاعده‌ی نظیر: هر منوی عملیاتی یک فهرست) و
        # R12 (کدِ مرده). محلی همیشه اجرا می‌شود؛ بدونِ این قدم فقط تا وقتی
        # کسی یادش بماند دستی بزند.
        working-directory: desktop
        run: node scripts/audit-pages.mjs

      - name: build
        working-directory: desktop
        run: npx vite build
        env:
          VITE_API_URL: https://acc.cubita.ir

  mobile:
    runs-on: ubuntu-latest
    # همان دلیلِ دو jobِ بالا: jobِ هنگ‌کرده بدونِ سقف تا شش ساعت اسلات را
    # نگه می‌دارد و صف پشتش می‌ماند.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: نصب
        run: npm ci

      - name: بررسی نوع‌ها
        run: npx tsc --noEmit

      - name: تست‌ها
        # اپ روی کافه‌بازار زنده است؛ تا پیش از این هیچ چیزی جز اجرای دستی
        # نمی‌گفت چیزی شکسته یا نه.
        run: npx jest --ci

      - name: ممیزِ ساختاری
        # معادلِ audit-pages.mjs دسکتاپ. کدِ مرده را می‌گیرد — همان چیزی که
        # باعث شد isOwner/hasPermission ماه‌ها بی‌استفاده بمانند بی‌آنکه کسی بفهمد.
        run: node scripts/audit-mobile.mjs
